name: Release DMG

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build universal .app
        run: wails build -platform darwin/universal -clean
        env:
          CGO_ENABLED: "1"

      - name: Verify CGO tray linkage
        run: |
          BINARY="build/bin/LamboServer.app/Contents/MacOS/LamboServer"
          echo "Checking Cocoa.framework linkage..."
          otool -L "$BINARY" | grep -q "Cocoa.framework" || { echo "FAIL: Cocoa.framework not linked"; exit 1; }
          echo "OK: Cocoa.framework linked"
          echo "Checking universal binary..."
          lipo -info "$BINARY" | grep -q "x86_64" || { echo "FAIL: missing x86_64 arch"; exit 1; }
          lipo -info "$BINARY" | grep -q "arm64" || { echo "FAIL: missing arm64 arch"; exit 1; }
          echo "OK: Universal binary (arm64 + x86_64)"

      - name: Clear extended attributes
        run: xattr -cr build/bin/LamboServer.app

      - name: Ad-hoc codesign
        run: |
          BINARY="build/bin/LamboServer.app/Contents/MacOS/LamboServer"
          # Sign the main binary first, then the bundle (--deep is deprecated and unreliable)
          codesign --force --sign - --entitlements build/darwin/entitlements.plist "$BINARY"
          codesign --force --sign - --entitlements build/darwin/entitlements.plist build/bin/LamboServer.app
          codesign --verify build/bin/LamboServer.app

      - name: Create DMG
        run: |
          STAGING=$(mktemp -d)
          cp -r build/bin/LamboServer.app "$STAGING/"
          xattr -cr "$STAGING/LamboServer.app"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create \
            -volname "LamboServer" \
            -srcfolder "$STAGING" \
            -ov \
            -format UDZO \
            "LamboServer-${{ steps.version.outputs.VERSION }}.dmg"
          rm -rf "$STAGING"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: LamboServer ${{ github.ref_name }}
          generate_release_notes: true
          files: LamboServer-${{ steps.version.outputs.VERSION }}.dmg
